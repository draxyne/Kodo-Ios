name: Build iOS
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet
        run: xcodegen generate

      - name: Compiler
        run: |
          xcodebuild \
            -project Kodo.xcodeproj \
            -scheme Kodo \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Créer l'IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Kodo.app Payload/
          zip -r Kodo.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Kodo-ipa
          path: Kodo.ipa

