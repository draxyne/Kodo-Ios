name: Kodo
options:
  bundleIdPrefix: fr.zyranex
  deploymentTarget:
    iOS: "17.0"
targets:
  Kodo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.zyranex.kodo
        PRODUCT_NAME: Kodo
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Kodo
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Kodo utilise le micro pour la dictée vocale."
        INFOPLIST_KEY_NSCameraUsageDescription: "Kodo utilise la caméra pour joindre des photos."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Kodo accède à tes photos pour les joindre."
